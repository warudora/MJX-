name: Publish updated MJX regulation PDFs
on:
  push:
    paths:
      - .github/workflows/publish-mjx-regulations.yml
      - scripts/publish_mjx_regulations.py
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PyMuPDF
        run: python -m pip install 'pymupdf>=1.26,<1.27'
      - name: Rebuild, split and validate PDFs
        run: |
          python scripts/publish_mjx_regulations.py
          python - <<'PY'
          from pathlib import Path
          import fitz
          counts=[4,5,11,8,6,18,3]
          names=['01-cinema-policy.pdf','02-general-server-rules.pdf','03-builder-regulations.pdf','04-resource-pack-rules.pdf','05-privacy-policy.pdf','06-economic-regulations.pdf','07-visitor-rules.pdf']
          for name,n in zip(names,counts):
              with fitz.open(Path('regulations/fulltext')/name) as doc:
                  assert len(doc)==n,(name,len(doc),n)
          with fitz.open('MJX_all_seven_regulations_2026-11-01.pdf') as doc:
              assert len(doc)==55
              for number in (4,9,20,28,34,52,55):
                  # The bottom-right logo must occupy a complete, centered,
                  # non-clipped region with margins on all four sides.
                  pix=doc[number-1].get_pixmap(
                      matrix=fitz.Matrix(2,2),
                      clip=fitz.Rect(440,680,542,765),
                      alpha=False
                  )
                  width,height,channels=pix.width,pix.height,pix.n
                  samples=pix.samples
                  pixels=[]
                  for y in range(height):
                      for x in range(width):
                          k=(y*width+x)*channels
                          r,g,b=samples[k],samples[k+1],samples[k+2]
                          if r>120 and g<115 and b>40 and r>g*1.6:
                              pixels.append((x,y))
                  assert len(pixels)>1200,(number,"logo missing",len(pixels))
                  left=min(p[0] for p in pixels)
                  right=max(p[0] for p in pixels)
                  top=min(p[1] for p in pixels)
                  bottom=max(p[1] for p in pixels)
                  assert left>8 and top>8 and right<width-9 and bottom<height-9,(number,"logo clipped",(left,top,right,bottom))
          print('Verified seven split PDFs, 55 pages, and all seven unclipped logos.')
          PY
      - name: Replace published originals
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add regulations/fulltext/*.pdf MJX_all_seven_regulations_2026-11-01.pdf regulations.html regulations-en.html
          if ! git diff --cached --quiet; then
            git commit -m "Replace MJX regulation PDFs with corrected 55-page layout"
            git push
          fi
