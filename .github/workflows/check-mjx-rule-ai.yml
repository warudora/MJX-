name: Check MJX rules assistant
on:
  push:
    paths:
      - 'rules-ai.html'
      - 'sitemap.xml'
      - 'scripts/check_mjx_seo.cjs'
      - 'scripts/generate_english_regulations.py'
      - 'mjx-rule-ai.js'
      - 'mjx-ai-float.js'
      - 'mjx-ai-float.css'
      - 'mjx-rule-ai.css'
      - 'mjx-rule-ai-config.js'
      - 'mjx-lang.js'
      - 'worker/**'
      - 'scripts/check_mjx_rule_ai.mjs'
      - 'regulations-full.html'
      - 'index.html'
      - 'index-en.html'
      - 'regulations.html'
      - 'regulations-en.html'
      - 'regulations-full-en.html'
      - 'jp.html'
      - 'en.html'
      - '.github/workflows/check-mjx-rule-ai.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax checks
        run: |
          node --check mjx-rule-ai.js
          node --check mjx-ai-float.js
          node --check mjx-rule-ai-config.js
          node --check mjx-lang.js
          node --check worker/index.js
          node --check scripts/check_mjx_rule_ai.mjs
          node --check scripts/check_mjx_seo.cjs
          python -m py_compile scripts/generate_english_regulations.py
      - name: Test source extraction, search and API behavior
        run: node scripts/check_mjx_rule_ai.mjs
      - name: Check SEO canonical URLs and sitemap
        run: node scripts/check_mjx_seo.cjs
