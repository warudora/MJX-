name: Diagnose MJX AI on WebKit
on:
  push:
    paths:
      - '.github/workflows/diagnose-mjx-webkit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  safari-engine:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install matching Playwright package
        run: npm install --no-save playwright@1.58.2
      - name: Exercise public AI page and embedded assistant in WebKit
        run: node scripts/diagnose_mjx_webkit.mjs
