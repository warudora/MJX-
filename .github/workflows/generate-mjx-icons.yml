name: Generate MJX site icons
on:
  push:
    paths:
      - assets/original-logo/source-0.b64.txt
      - assets/original-logo/source-1.b64.txt
      - scripts/generate_brand_assets.py
      - .github/workflows/generate-mjx-icons.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image tools
        run: python -m pip install 'Pillow>=11,<13'
      - name: Generate uncropped full-logo icons
        run: python scripts/generate_brand_assets.py
      - name: Verify whole logo retained
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          from io import BytesIO
          from PIL import Image, ImageChops
          root=Path('assets')
          chunks=['source-0.b64.txt','source-1.b64.txt']
          raw=base64.b64decode(''.join((root/'original-logo'/c).read_text().strip() for c in chunks))
          with Image.open(BytesIO(raw)) as src:
              original=src.convert('RGB')
              for name,pixels in [('mjx-logo-original.png',512),('og-mjx.png',512),
                                  ('favicon-32.png',32),('apple-touch-icon.png',180),
                                  ('mjx-icon-192.png',192),('mjx-icon-512.png',512)]:
                  path=root/name
                  with Image.open(path) as candidate:
                      assert candidate.size==(pixels,pixels),(name,candidate.size)
                      baseline=original.resize((pixels,pixels),Image.Resampling.LANCZOS)
                      assert ImageChops.difference(candidate.convert('RGB'),baseline).getbbox() is None, name
          assert Path('favicon.ico').is_file()
          print('All icons retain the source image composition without cropping')
          PY
      - name: Publish generated icons
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add favicon.ico assets/mjx-logo-original.png assets/favicon-32.png assets/apple-touch-icon.png assets/mjx-icon-192.png assets/mjx-icon-512.png assets/og-mjx.png
          if ! git diff --cached --quiet; then
            git commit -m "Replace stylized site icons with full original MJX logo"
            git push
          fi
